name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore EMRSimulationWebApp/EMRSimulationWebApp/EMRSimulationWebApp.sln

    - name: Build Solution
      run: dotnet build EMRSimulationWebApp/EMRSimulationWebApp/EMRSimulationWebApp.sln --configuration Release --no-restore

